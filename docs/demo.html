<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XMU 课程表 · 演示视频</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
    }
    main { width: min(420px, 100%); padding: 24px; box-sizing: border-box; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      max-height: 80vh;
    }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>XMU 课程表 · v1.1.1 演示</h1>
    <p>非正式宣传片，仅作界面与流程预览（约 7MB）。返回 <a href="https://github.com/Xiyujiang0203/XMUCourseApp">仓库首页</a>。</p>
    <video
      src="./demo.mp4"
      controls
      playsinline
      preload="metadata"
    ></video>
  </main>
</body>
</html>
